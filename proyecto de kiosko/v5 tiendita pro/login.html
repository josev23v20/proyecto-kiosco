

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="login.css">

</head>

<body>

<!--                  display="" id="loginBox"-->
 <div class="container mt-4" style="max-width: 50%;  min-width: 100PX;">

   <div class="card p-4 shadow">

      <h3 class="text-center mb-3">
        Iniciar sesión
      </h3>

    <!-- NOMBRE -->

   <input
    type="text"
    id="nombre"
    class="form-control mb-3"
    placeholder="Nombre">

    <!-- CONTRASEÑA -->

   <input
      type="password"
      id="password"
      class="form-control mb-3"
      placeholder="Contraseña">

    <!-- CONFIRMAR CONTRASEÑA -->

    <input
      type="password"
      id="passwordConfirm"
      class="form-control mb-3"
      placeholder="Confirmar contraseña">

    <!-- CURSO -->

    <select
      id="curso"
      class="form-select mb-3">

     <option value="">Seleccionar curso / S.c.b</option>

     <option>sala de profesores</option>
     <option>coordinacion</option>
     <option>bliblioteca</option>
     <option>profesores</option>
     <option>ATD</option>

     <option>1ºA</option>
     <option>1ºB</option>
     <option>1ºC</option>

     <option>2ºA</option>
     <option>2ºB</option>
     <option>2ºC</option>

     <option>3ºA</option>
     <option>3ºB</option>
     <option>3ºC</option>

     <option>4ºAlimentos</option>
     <option>4ºProgramación</option>
     <option>4ºComunicación</option>

     <option>5ºAlimentos</option>
     <option>5ºProgramación</option>
     <option>5ºComunicación</option>

     <option>6ºAlimentos</option>
     <option>6ºProgramación</option>
     <option>6ºComunicación</option>

     <option>7ºAlimentos</option>
     <option>7ºProgramación</option>

    </select>

<!-- BOTON -->

  <button
   class="btn btn-primary w-100"
   onclick="login()">

   Entrar

  </button>

  <button
   class="btn btn-outline-secondary w-100 mt-3"
   onclick="registrarse()">

   Registrarse

   </button>

  </div>

 </div>
</body>

<script src="javascrip.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
