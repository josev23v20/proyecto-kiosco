<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tiendita buen precio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body class="tema-claro">

<header class="bg-danger text-white text-center p-3">
  <h1>🧃 Tiendita buen precio</h1>
</header>

<!-- 🛒 CARRITO -->
<div class="carrito-fijo card">
  <div class="card-body">
    <h5>🛒 Carrito</h5>
    <ul id="lista-carrito"></ul>
    <p>Total: $<span id="total">0</span></p>
    <button class="btn btn-success w-100" onclick="finalizarCompra()">Comprar</button>
  </div>
</div>

<div class="container mt-4">
  <div class="row">

    <!-- PRODUCTO -->
    <div class="col-md-4">
      <div class="card producto-card">
        <img src="carpetas de imagenes/OIP (1).webp" class="card-img-top">
        <div class="card-body text-center">
          <h5>Donsatur</h5>
          <p class="precio">$1200</p>
          <p id="stock-Galletitas" class="stock"></p>

          <button class="btn btn-outline-dark mb-2" onclick="verProducto('Galletitas',1200)">
            Ver producto
          </button>

          <button class="btn btn-danger w-100" onclick="agregar('Galletitas',1200)">
            Agregar
          </button>
        </div>
      </div>
    </div>

    <!-- PRODUCTO -->
    <div class="col-md-4">
      <div class="card producto-card">
        <img src="carpetas de imagenes/OIP.webp" class="card-img-top">
        <div class="card-body text-center">
          <h5>Gaseosa</h5>
          <p class="precio">$1000</p>
          <p id="stock-Gaseosa" class="stock"></p>

          <button class="btn btn-outline-dark mb-2" onclick="verProducto('Gaseosa',1000)">
            Ver producto
          </button>

          <button class="btn btn-danger w-100" onclick="agregar('Gaseosa',1000)">
            Agregar
          </button>
        </div>
      </div>
    </div>

    <!-- PRODUCTO -->
    <div class="col-md-4">
      <div class="card producto-card">
        <img src="carpetas de imagenes/OIP (2).webp" class="card-img-top">
        <div class="card-body text-center">
          <h5>Biscochuelo</h5>
          <p class="precio">$1000</p>
          <p id="stock-Chocolate" class="stock"></p>

          <button class="btn btn-outline-dark mb-2" onclick="verProducto('Chocolate',1000)">
            Ver producto
          </button>

          <button class="btn btn-danger w-100" onclick="agregar('Chocolate',1000)">
            Agregar
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="modalProducto">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="tituloProducto"></h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="precioProducto"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" onclick="agregarDesdeModal()">Agregar</button>
      </div>
    </div>
  </div>
</div>

<!-- MERCADO NEGRO -->
<div class="text-center mt-5 mb-3">
  <button class="btn btn-dark" onclick="mercadoNegro()">
    ⚠ Mercado Negro
  </button>
</div>

<script src="javascrip.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
