<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tiendita buen precio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="tema-claro">

<div id="contenido" style="display:none;">

  <nav class="navbar navbar-light bg-light shadow">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuOpciones">
        <span class="navbar-toggler-icon"></span>
      </button>
      <span class="navbar-brand mx-auto">🧃 Tiendita buen precio</span>
    </div>
  </nav>

  <!-- MENU DESPLEGABLE -->
  <div class="collapse" id="menuOpciones">
    <div class="bg-light p-3">
      <h5>Filtros</h5>

      <button class="btn btn-outline-primary w-100 mb-2" onclick="filtrarCategoria('todos')">Todos</button>
      <button class="btn btn-outline-success w-100 mb-2" onclick="filtrarCategoria('galleta')">Galletas</button>
      <button class="btn btn-outline-warning w-100 mb-2" onclick="filtrarCategoria('bebida')">Bebidas</button>
      <button class="btn btn-outline-danger w-100 mb-2" onclick="filtrarCategoria('golosina')">Golosinas</button>
      <button class="btn btn-outline-dark w-100 mb-2" onclick="filtrarCategoria('snack')">Snacks</button>

      <hr>
      <input type="text" id="buscador" class="form-control" placeholder="Buscar..." onkeyup="filtrarProductos()">
    </div>
  </div>

  <!-- CARRITO -->
  <div class="carrito-fijo card">
    <div class="card-body">
      <h5>🛒 Carrito</h5>
      <ul id="lista-carrito"></ul>
      <p>Total: $<span id="total">0</span></p>
      <button class="btn btn-success w-100" onclick="finalizarCompra()">Comprar</button>
    </div>
  </div>

  <div class="container mt-4">
    <div id="userStatus"></div>
    <div class="row" id="contenedor-productos">
      <!-- Los productos se cargan dinámicamente desde la API -->
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="modalProducto">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="tituloProducto"></h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p id="precioProducto"></p>
          <p id="stockProducto"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" onclick="agregarDesdeModal()">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SONIDO -->
  <audio id="sonidoSecreto" src="https://www.myinstants.com/media/sounds/vine-boom.mp3"></audio>

  <!-- Acceso discreto al Mercado Negro: un texto de pie de página, no un botón vistoso -->
  <div class="text-center mt-5 mb-3">
    <a href="mercado.html" class="footer-secreto" onclick="document.getElementById('sonidoSecreto').play()">v1.4.2</a>
  </div>

</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script>const MERCADO_NEGRO = false;</script>
<script src="tienda.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
