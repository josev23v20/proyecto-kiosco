
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel admin - Tiendita buen precio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .miniatura { width: 48px; height: 48px; object-fit: cover; border-radius: 10px; background: #f1f5f9; }
    .miniatura-vacia { width: 48px; height: 48px; border-radius: 10px; background: #f1f5f9; color: #94a3b8;
                       display: flex; align-items: center; justify-content: center; font-size: 0.65rem; }
    #np-preview { max-width: 160px; max-height: 160px; border-radius: 12px; display: none; }
  </style>
</head>

<body class="tema-claro">

<nav class="navbar navbar-light bg-light shadow">
  <div class="container-fluid">
    <a href="index.html" class="btn btn-outline-dark btn-sm">← Volver a la tienda</a>
    <span class="navbar-brand mx-auto">🛠 Panel de administración</span>
  </div>
</nav>

<div class="container mt-4 mb-5">
  <div id="userStatus"></div>

  <h4 class="mt-4 mb-3">Pedidos</h4>
  <div class="table-responsive">
    <table class="table table-striped align-middle bg-white rounded shadow-sm">
      <thead>
        <tr><th>Código</th><th>Alumno / curso</th><th>Productos</th><th>Total</th><th>Estado</th></tr>
      </thead>
      <tbody id="tabla-pedidos"></tbody>
    </table>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-5 mb-3">
    <h4 class="mb-0">Productos y stock</h4>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevoProducto">+ Agregar producto</button>
  </div>
  <div class="table-responsive">
    <table class="table table-striped align-middle bg-white rounded shadow-sm">
      <thead>
        <tr><th>Imagen</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th></tr>
      </thead>
      <tbody id="tabla-productos"></tbody>
    </table>
  </div>

  <!-- input oculto, lo usa el botón "Cambiar imagen" de cada fila -->
  <input type="file" id="input-cambiar-imagen" accept="image/png,image/jpeg,image/webp" style="display:none;">
</div>

<!-- MODAL: AGREGAR PRODUCTO -->
<div class="modal fade" id="modalNuevoProducto" tabindex="-1">
  <div class="modal-dialog">
    <form id="form-nuevo-producto" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Agregar producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" id="np-nombre" class="form-control" maxlength="80" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Categoría</label>
          <select id="np-categoria" class="form-select" required>
            <option value="">Seleccionar...</option>
            <option value="galleta">Galleta</option>
            <option value="bebida">Bebida</option>
            <option value="golosina">Golosina</option>
            <option value="snack">Snack</option>
          </select>
        </div>
        <div class="row">
          <div class="col mb-3">
            <label class="form-label">Precio</label>
            <input type="number" id="np-precio" class="form-control" min="0" required>
          </div>
          <div class="col mb-3">
            <label class="form-label">Stock inicial</label>
            <input type="number" id="np-stock" class="form-control" min="0" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Imagen (PNG, JPG o WEBP, máx. 2 MB)</label>
          <input type="file" id="np-imagen" class="form-control" accept="image/png,image/jpeg,image/webp">
          <img id="np-preview" class="mt-2" alt="Vista previa">
        </div>
        <div class="form-check">
          <input type="checkbox" id="np-mercado" class="form-check-input">
          <label class="form-check-label" for="np-mercado">Es producto del Mercado Negro</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="np-guardar">Agregar producto</button>
      </div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
